[platformio]
default_envs = lilygo

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DUSER_SETUP_LOADED
  -include include/board_setup.h
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5

[env:lilygo]
board = lilygo-t-display-s3
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:cyd]
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_cyd.csv
board_build.filesystem = littlefs
extra_scripts = post:tools/fs_tool.py
build_flags =
  ${env.build_flags}
  -DTRA_BOARD_CYD

[env:cyd-st7789]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -DTRA_CYD_ST7789
